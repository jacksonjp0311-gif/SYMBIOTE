[package]
name = "symbiote-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "symbiote"
path = "src/main.rs"

[[bin]]
name = "structural-transfer-002"
path = "src/bin/structural_transfer_002.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
symbiote-reasoning = { path = "../symbiote-reasoning" }
symbiote-protocol = { path = "../symbiote-protocol" }
symbiote-memory = { path = "../symbiote-memory" }
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring", "pem"] }
