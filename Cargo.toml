[workspace]
members = ["crates/symbiote-reasoning", "crates/symbiote-protocol", "crates/symbiote-memory", "crates/symbiote-runtime"]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
