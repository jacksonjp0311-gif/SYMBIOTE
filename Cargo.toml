[workspace]
members = ["crates/symbiote-reasoning", "crates/symbiote-protocol", "crates/symbiote-memory", "crates/symbiote-runtime"]
resolver = "2"

[workspace.package]
version = "1.1.1"
edition = "2021"
rust-version = "1.98.1"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
