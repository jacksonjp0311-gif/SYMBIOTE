name: Verified release bundles
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to package
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - id: release
        name: Bind release tag to source version and commit
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          python - <<'PY'
          import os, re, subprocess, tomllib
          from pathlib import Path
          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?', tag):
              raise SystemExit('Invalid release tag')
          version = tomllib.loads(Path('Cargo.toml').read_text())['workspace']['package']['version']
          if tag != 'v' + version:
              raise SystemExit('Release tag does not match workspace version')
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          pinned = subprocess.check_output(['git', 'rev-parse', 'refs/tags/' + tag + '^{commit}'], text=True).strip()
          if pinned != sha:
              raise SystemExit('Checkout is not the pinned release tag')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('tag=' + tag + '\nsha=' + sha + '\n')
          PY

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            executable: symbiote.exe
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            executable: symbiote
          - os: macos-15
            target: aarch64-apple-darwin
            executable: symbiote
          - os: macos-15-intel
            target: x86_64-apple-darwin
            executable: symbiote
    runs-on: ${{ matrix.os }}
    env:
      SYMBIOTE_SOURCE_COMMIT: ${{ needs.prepare.outputs.sha }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Reproduce software and research gates
        run: python tools/verify.py
      - name: Build native release executable
        run: cargo build --release --locked -p symbiote-runtime --bin symbiote --target ${{ matrix.target }}
      - name: Create architecture-checked bundle and checksums
        run: python tools/package_release.py --binary target/${{ matrix.target }}/release/${{ matrix.executable }} --target ${{ matrix.target }} --version ${{ needs.prepare.outputs.tag }} --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: symbiote-${{ matrix.target }}
          path: dist/*.zip
          if-no-files-found: error

  publish:
    name: Stage native bundles for qualification
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          pattern: symbiote-*
          merge-multiple: true
          path: dist
      - name: Verify complete platform set and checksum manifest
        run: >-
          python tools/package_release.py --verify-dir dist --write-manifest
          --version ${{ needs.prepare.outputs.tag }}
          --require-target x86_64-pc-windows-msvc
          --require-target x86_64-unknown-linux-gnu
          --require-target aarch64-apple-darwin
          --require-target x86_64-apple-darwin
      - name: Stage verified assets without replacing existing files
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "SYMBIOTE $RELEASE_TAG" --generate-notes "${flags[@]}"
          fi
          check_dir=$(mktemp -d)
          trap 'rm -rf -- "$check_dir"' EXIT
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' > "$check_dir/existing-assets"
          for local_asset in dist/*.zip dist/SHA256SUMS; do
            name=$(basename "$local_asset")
            if grep -Fxq "$name" "$check_dir/existing-assets"; then
              gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$name" --dir "$check_dir"
              if ! cmp --silent "$local_asset" "$check_dir/$name"; then
                echo "Existing release asset differs; refusing to replace $name" >&2
                exit 1
              fi
              continue
            fi
            gh release upload "$RELEASE_TAG" "$local_asset" --repo "$GITHUB_REPOSITORY"
          done
          echo "Native bundles are staged. New releases remain draft until independent delivery and qualification checks finish."
          echo "Existing assets are not replaced and public releases are not unpublished; this workflow does not grant stable qualification."
