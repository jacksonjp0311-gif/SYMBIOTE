name: Accept anonymous v1.1 published bytes

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact reviewed workflow and candidate source SHA
        required: true
        type: string
      candidate_run_id:
        description: Completed exact-source staged candidate run
        required: true
        type: string
      plan_sha256:
        description: Externally reviewed publication plan digest
        required: true
        type: string
      zip_windows:
        description: Reviewed x86_64-pc-windows-msvc ZIP SHA256
        required: true
        type: string
      zip_linux:
        description: Reviewed x86_64-unknown-linux-gnu ZIP SHA256
        required: true
        type: string
      zip_macos_arm:
        description: Reviewed aarch64-apple-darwin ZIP SHA256
        required: true
        type: string
      zip_macos_intel:
        description: Reviewed x86_64-apple-darwin ZIP SHA256
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: v11-public-${{ inputs.source_commit }}-${{ inputs.plan_sha256 }}
  cancel-in-progress: false

jobs:
  bind:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      source: ${{ steps.bind.outputs.source }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - id: bind
        name: Refuse a different workflow source or incomplete candidate
        env:
          EXPECTED_SOURCE: ${{ inputs.source_commit }}
          CANDIDATE_RUN: ${{ inputs.candidate_run_id }}
          PLAN_SHA: ${{ inputs.plan_sha256 }}
          ZIP_WINDOWS: ${{ inputs.zip_windows }}
          ZIP_LINUX: ${{ inputs.zip_linux }}
          ZIP_MACOS_ARM: ${{ inputs.zip_macos_arm }}
          ZIP_MACOS_INTEL: ${{ inputs.zip_macos_intel }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python -B - <<'PY'
          import json, os, re, subprocess, urllib.request
          expected = os.environ['EXPECTED_SOURCE']
          actual = subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert re.fullmatch('[0-9a-f]{40}',expected) and expected == actual == os.environ['GITHUB_SHA']
          assert os.environ['GITHUB_REPOSITORY'] == 'jacksonjp0311-gif/SYMBIOTE'
          assert re.fullmatch('[1-9][0-9]*',os.environ['CANDIDATE_RUN'])
          for key in ['PLAN_SHA','ZIP_WINDOWS','ZIP_LINUX','ZIP_MACOS_ARM','ZIP_MACOS_INTEL']:
              assert re.fullmatch('[0-9a-f]{64}',os.environ[key])
          url = 'https://api.github.com/repos/jacksonjp0311-gif/SYMBIOTE/actions/runs/' + os.environ['CANDIDATE_RUN']
          request = urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs): raise ValueError('metadata redirect refused')
          with urllib.request.build_opener(NoRedirect()).open(request,timeout=30) as response:
              raw = response.read(1048577)
          assert len(raw) <= 1048576
          run = json.loads(raw)
          assert run['repository']['full_name'] == 'jacksonjp0311-gif/SYMBIOTE'
          assert run['head_sha'] == expected and run['path'] == '.github/workflows/v11-candidate.yml'
          assert run['event'] == 'workflow_dispatch' and run['status'] == 'completed' and run['conclusion'] == 'success'
          with open(os.environ['GITHUB_OUTPUT'],'a') as output: output.write('source='+expected+'\n')
          PY

  public-platform:
    needs: bind
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            digest_input: zip_windows
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            digest_input: zip_linux
          - os: macos-15
            target: aarch64-apple-darwin
            digest_input: zip_macos_arm
          - os: macos-15-intel
            target: x86_64-apple-darwin
            digest_input: zip_macos_intel
    runs-on: ${{ matrix.os }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.bind.outputs.source }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: v11-native-${{ matrix.target }}
          path: candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - id: verifier
        name: Pin the matching runner's actual GitHub verifier
        shell: bash
        env:
          ACCEPT_TARGET: ${{ matrix.target }}
        run: |
          python -B - <<'PY'
          import hashlib, os, shutil, tempfile
          from pathlib import Path
          command = shutil.which('gh')
          if command is None: raise SystemExit('GitHub CLI is required for fresh cryptographic verification')
          command = Path(command).resolve(strict=True)
          digest = hashlib.sha256(command.read_bytes()).hexdigest()
          acceptance = Path(tempfile.gettempdir()).resolve(strict=True) / ('symbiote-v11-public-' + os.environ['ACCEPT_TARGET'] + '-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'])
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write('path='+str(command)+'\nsha256='+digest+'\nacceptance='+str(acceptance)+'\n')
          PY
      - name: Anonymous public bytes, original signed components, actual installed behavior
        env:
          SYMBIOTE_METADATA_TOKEN: ${{ github.token }}
        run: >-
          python -B tools/release/v11_release_checks.py public-accept
          --candidate-root candidate --candidate-run-id ${{ inputs.candidate_run_id }}
          --target ${{ matrix.target }} --tag v1.1.2 --commit ${{ needs.bind.outputs.source }}
          --bundle-sha256 ${{ inputs[matrix.digest_input] }} --plan-sha256 ${{ inputs.plan_sha256 }}
          --gh "${{ steps.verifier.outputs.path }}" --gh-sha256 ${{ steps.verifier.outputs.sha256 }}
          --metadata-token-env SYMBIOTE_METADATA_TOKEN
          --out "${{ steps.verifier.outputs.acceptance }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: v11-public-${{ matrix.target }}
          path: ${{ steps.verifier.outputs.acceptance }}/**
          if-no-files-found: error
          retention-days: 30

# No build, release/tag mutation, asset replacement or latest promotion occurs.
# A failure remains recorded against the same immutable provisional bytes.
