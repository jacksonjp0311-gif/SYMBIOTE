name: Genesis verification
on: [push, pull_request]
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      SYMBIOTE_SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: '1.98.1'
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python tools/verify.py
      - name: Document the supported API on the minimum compiler
        env:
          RUSTDOCFLAGS: '-D warnings'
        run: cargo doc --workspace --all-features --no-deps --locked

  current-stable:
    name: Current stable compatibility
    runs-on: ubuntu-latest
    env:
      SYMBIOTE_SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          components: clippy
      - run: rustc -vV
      - run: cargo test --workspace --all-features --locked
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
